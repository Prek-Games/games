<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preschool Picture Match</title>
  <style>
    :root {
      --blue: #4f9cff;
      --yellow: #ffe680;
      --pink: #ff9ecb;
      --green: #8ee6a3;
      --purple: #b79cff;
      --dark: #27364a;
      --white: #ffffff;
      --shadow: rgba(36, 54, 74, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
      color: var(--dark);
      background:
        radial-gradient(circle at top left, #fff1a8 0 18%, transparent 19%),
        radial-gradient(circle at bottom right, #c8f7ff 0 22%, transparent 23%),
        linear-gradient(135deg, #fff7cf, #eaf7ff 45%, #fff0fa);
      display: flex;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .app {
      width: min(980px, 100%);
      text-align: center;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: clamp(2rem, 5vw, 3.6rem);
      text-shadow: 2px 3px 0 #fff;
    }

    .subtitle {
      font-size: clamp(1rem, 2.8vw, 1.35rem);
      margin: 0 0 18px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.8);
      border: 4px solid white;
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 8px 22px var(--shadow);
      margin-bottom: 18px;
    }

    label {
      font-size: 1.15rem;
      font-weight: 700;
    }

    select,
    button {
      font: inherit;
      font-weight: 800;
      border: none;
      border-radius: 18px;
      padding: 12px 18px;
      cursor: pointer;
    }

    select {
      background: #fff;
      border: 3px solid var(--blue);
      color: var(--dark);
    }

    button {
      color: #25304a;
      background: linear-gradient(180deg, #ffe680, #ffc95d);
      box-shadow: 0 5px 0 #de9d27, 0 8px 18px var(--shadow);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-2px);
      outline: 4px solid rgba(79, 156, 255, 0.35);
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #de9d27, 0 5px 12px var(--shadow);
    }

    .status {
      min-height: 36px;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 800;
      margin: 8px 0 16px;
    }

    .game-board {
      display: grid;
      gap: clamp(10px, 2vw, 16px);
      justify-content: center;
      margin: 0 auto 24px;
    }

    .card {
      width: 100%;
      max-width: 138px;
      aspect-ratio: 3 / 4;
      perspective: 900px;
      border: 0;
      background: transparent;
      padding: 0;
      box-shadow: none;
    }

    .card:focus-visible {
      outline: 5px solid rgba(79, 156, 255, 0.7);
      border-radius: 22px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.45s ease;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      border: 5px solid white;
      box-shadow: 0 10px 18px var(--shadow);
      overflow: hidden;
    }

    .card-face {
      -webkit-backface-visibility: hidden;
    }

    /* Hide the hidden side outright (not just with backface-visibility), so the
       letter never shows through on screens that don't support it. The switch
       happens halfway through the flip, when the card is edge-on. */
    .front,
    .back {
      transition: visibility 0s linear 0.22s;
    }

    .card.flipped .front,
    .card.matched .front,
    .card:not(.flipped):not(.matched) .back {
      visibility: hidden;
    }

    .front {
      background: linear-gradient(145deg, #6db2ff, #8ee6ff);
    }

    .front::before,
    .front::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.35);
    }

    .front::before {
      width: 70%;
      height: 24%;
      top: 11%;
      left: -15%;
      transform: rotate(-18deg);
    }

    .front::after {
      width: 62%;
      height: 20%;
      bottom: 12%;
      right: -12%;
      transform: rotate(-18deg);
    }

    .letter {
      position: relative;
      z-index: 1;
      font-size: clamp(3.1rem, 10vw, 5.5rem);
      line-height: 1;
      color: white;
      text-shadow: 3px 4px 0 rgba(39, 54, 74, 0.22);
    }

    .back {
      background: #fffdf8;
      transform: rotateY(180deg);
      padding: 8px;
    }

    .picture {
      width: 86%;
      line-height: 0;
    }

    .picture svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .picture-name {
      margin-top: 6px;
      font-size: clamp(0.85rem, 2.4vw, 1.1rem);
      font-weight: 900;
      color: #33445d;
    }

    .matched .card-face {
      border-color: #8ee6a3;
      box-shadow: 0 0 0 6px rgba(142, 230, 163, 0.35), 0 10px 18px var(--shadow);
    }

    .confetti-piece {
      position: fixed;
      top: -20px;
      width: 12px;
      height: 18px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 20;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.9;
      }
    }

    .win-message {
      display: none;
      margin: 12px auto 0;
      width: fit-content;
      background: white;
      border: 5px solid var(--green);
      border-radius: 28px;
      padding: 14px 22px;
      font-size: clamp(1.3rem, 4vw, 2rem);
      font-weight: 900;
      box-shadow: 0 10px 22px var(--shadow);
    }

    .win-message.show {
      display: block;
    }

    /* small sparkle burst on each match */
    .sparkle {
      position: fixed;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      pointer-events: none;
      z-index: 20;
      font-size: 14px;
      line-height: 14px;
      text-align: center;
      animation: sparkle-out 0.8s ease-out forwards;
    }

    @keyframes sparkle-out {
      0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: 0; }
    }

    /* ---------- Team play ---------- */
    .scoreboard {
      display: flex;
      justify-content: center;
      gap: clamp(10px, 3vw, 24px);
      margin: 0 auto 6px;
    }

    .scoreboard[hidden] {
      display: none;
    }

    .team {
      --team: #e5484d;
      --team-soft: #ffe1e1;
      flex: 0 1 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 10px 14px 8px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.75);
      border: 5px solid transparent;
      box-shadow: 0 6px 16px var(--shadow);
      opacity: 0.55;
      transform: scale(0.94);
      transition: transform 0.25s ease, opacity 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .team-blue {
      --team: #3b82f6;
      --team-soft: #dcebff;
    }

    .team.active {
      opacity: 1;
      transform: scale(1.04);
      border-color: var(--team);
      background: var(--team-soft);
    }

    .team-name {
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      font-weight: 900;
      color: var(--team);
    }

    .team-score {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 900;
      line-height: 1.1;
    }

    .turn-tag {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--team);
      visibility: hidden;
    }

    .team.active .turn-tag {
      visibility: visible;
      animation: bounce 0.9s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .team.bump .team-score {
      animation: bump 0.5s ease;
    }

    @keyframes bump {
      40% { transform: scale(1.4); }
    }

    /* whose turn it is: tint the status line and board edge */
    body.teams-on .status {
      color: var(--turn-color, var(--dark));
    }

    .matched.found-red .card-face {
      border-color: #e5484d;
      box-shadow: 0 0 0 6px rgba(229, 72, 77, 0.25), 0 10px 18px var(--shadow);
    }

    .matched.found-blue .card-face {
      border-color: #3b82f6;
      box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.25), 0 10px 18px var(--shadow);
    }

    @media (prefers-reduced-motion: reduce) {
      .team.active .turn-tag,
      .team.bump .team-score {
        animation: none;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      .controls {
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Picture Match!</h1>
    <p class="subtitle">Pick two cards. Match the animal friends!</p>

    <section class="controls" aria-label="Game controls">
      <label for="cardCount">Cards in play:</label>
      <select id="cardCount" aria-label="Choose number of cards">
        <option value="8" selected>8 cards</option>
        <option value="12">12 cards</option>
        <option value="16">16 cards</option>
        <option value="24">24 cards</option>
      </select>
      <label for="playerMode">Players:</label>
      <select id="playerMode" aria-label="Choose solo or team play">
        <option value="solo" selected>Just me</option>
        <option value="teams">Two teams</option>
      </select>
      <button id="playAgain" type="button">Play Again</button>
    </section>

    <section id="scoreboard" class="scoreboard" aria-label="Team scores" hidden>
      <div class="team team-red" id="teamRed">
        <span class="team-name">Red Team</span>
        <span class="team-score"><span id="scoreRed">0</span> ⭐</span>
        <span class="turn-tag">Your turn!</span>
      </div>
      <div class="team team-blue" id="teamBlue">
        <span class="team-name">Blue Team</span>
        <span class="team-score"><span id="scoreBlue">0</span> ⭐</span>
        <span class="turn-tag">Your turn!</span>
      </div>
    </section>

    <div id="status" class="status" aria-live="polite">Find a match!</div>
    <section id="gameBoard" class="game-board" aria-label="Memory card game"></section>
    <div id="winMessage" class="win-message" aria-live="polite">You matched them all! Great job! 🎉</div>
  </main>

  <script>
    // Cartoon animal drawings (inline SVG, so the game works offline)
    const OL = "#4a3426";
    const svgWrap = inner =>
      `<svg viewBox="0 -6 120 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">` +
      `<ellipse cx="60" cy="117" rx="34" ry="5" fill="#000" opacity="0.08"/>` +
      `<g stroke="${OL}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">${inner}</g></svg>`;
    const mirror = inner => `<g transform="translate(120 0) scale(-1 1)">${inner}</g>`;
    const both = inner => inner + mirror(inner);
    const body = (fill, extra = "") =>
      `<path d="M34 112 C30 92 40 78 60 78 C80 78 90 92 86 112 Z" fill="${fill}"/>${extra}` +
      `<path d="M50 99 L50 112 M70 99 L70 112" fill="none" stroke-width="3"/>`;
    const eyes = (y = 52, dx = 13) =>
      both(`<circle cx="${60 - dx}" cy="${y}" r="5" fill="#33241a" stroke="none"/>` +
           `<circle cx="${61.6 - dx}" cy="${y - 1.8}" r="1.7" fill="#fff" stroke="none"/>`);
    const blush = (y = 62, dx = 23) =>
      both(`<ellipse cx="${60 - dx}" cy="${y}" rx="6" ry="4" fill="#ff8f8f" opacity="0.55" stroke="none"/>`);
    const wMouth = y => `<path d="M54 ${y} q3 4 6 0 q3 4 6 0" fill="none" stroke-width="3"/>`;
    const whiskers = y => both(`<path d="M30 ${y} l-13 -2 M30 ${y + 5} l-12 3" fill="none" stroke-width="2.5"/>`);
    const thickTail = (d, fill) =>
      `<path d="${d}" fill="none" stroke-width="12"/><path d="${d}" fill="none" stroke="${fill}" stroke-width="5"/>`;

    const animalArt = {
      Puppy: (() => { const c = "#f6cf8f", e = "#b9784a"; return svgWrap(
        `<path d="M84 104 q14 -2 10 -18" fill="none"/>` + body(c) +
        `<ellipse cx="60" cy="52" rx="34" ry="30" fill="${c}"/>` +
        both(`<path d="M34 28 C16 28 10 52 18 66 C24 74 34 68 36 58 C38 46 42 34 34 28 Z" fill="${e}"/>`) +
        eyes(52, 14) + blush(64, 22) +
        `<ellipse cx="60" cy="60" rx="5" ry="3.5" fill="#33241a"/>` +
        `<path d="M58 69 q2 6 4 0" fill="#ff7d8c" stroke-width="2"/>` + wMouth(64)); })(),

      Cow: (() => { const c = "#fffaf2", s = "#c98d5a"; return svgWrap(
        `<path d="M86 102 q12 0 10 -14" fill="none"/>` +
        body(c, `<path d="M70 84 q12 -2 12 10 q-8 6 -14 0 q-4 -6 2 -10 Z" fill="${s}" stroke="none"/>`) +
        both(`<path d="M42 30 Q34 16 42 12 Q48 18 50 26" fill="#f3d27a"/>` +
             `<ellipse cx="24" cy="44" rx="13" ry="7" transform="rotate(-20 24 44)" fill="${c}"/>` +
             `<ellipse cx="25" cy="44" rx="6" ry="3" transform="rotate(-20 25 44)" fill="#f7b5b0" stroke="none"/>`) +
        `<ellipse cx="60" cy="52" rx="34" ry="30" fill="${c}"/>` +
        `<path d="M66 30 q10 -6 16 2 q4 8 -4 12 q-10 2 -12 -14 Z" fill="${s}" stroke="none"/>` +
        eyes(47, 14) + blush(58, 25) +
        `<ellipse cx="60" cy="68" rx="17" ry="10" fill="#f8c1bb"/>` +
        both(`<ellipse cx="54" cy="66" rx="2" ry="2.8" fill="#33241a" stroke="none"/>`) +
        `<path d="M56 73 q4 2.5 8 0" fill="none" stroke-width="2.5"/>`); })(),

      Piggy: (() => { const c = "#f8bcbc", d = "#f2949f"; return svgWrap(
        `<path d="M86 100 q10 -1 8 -8 q-4 -5 -7 1 q-1 6 9 6" fill="none" stroke-width="3.5"/>` + body(c) +
        both(`<path d="M32 36 L28 12 L52 25 Z" fill="${c}"/><path d="M35 30 L33 19 L45 25 Z" fill="${d}" stroke="none"/>`) +
        `<ellipse cx="60" cy="52" rx="34" ry="30" fill="${c}"/>` +
        eyes(48, 14) + blush(60, 24) +
        `<ellipse cx="60" cy="63" rx="13" ry="8.5" fill="${d}"/>` +
        both(`<ellipse cx="55" cy="63" rx="2.2" ry="3" fill="#8a4b52" stroke="none"/>`)); })(),

      Chick: (() => { const c = "#fde98f"; return svgWrap(
        `<path d="M60 34 C50 25 52 16 58 18 C60 19 60 21 60 22 C60 21 60 19 62 18 C68 16 70 25 60 34 Z" fill="#ef4f5f" stroke-width="3"/>` +
        `<path d="M50 110 l-2 7 M50 110 l3 7 M70 110 l-3 7 M70 110 l2 7" fill="none" stroke="#f0972f" stroke-width="3"/>` +
        `<ellipse cx="60" cy="72" rx="38" ry="40" fill="${c}"/>` +
        `<path d="M93 76 q10 6 2 18" fill="${c}" stroke-width="3.5"/>` +
        `<path d="M27 76 q-10 6 -2 18" fill="${c}" stroke-width="3.5"/>` +
        eyes(64, 14) + blush(75, 24) +
        `<path d="M54 72 L60 79 L66 72 Q60 68 54 72 Z" fill="#f6a03c" stroke-width="3"/>`); })(),

      Kitty: (() => { const c = "#f6b870", p = "#f7a8b0"; return svgWrap(
        thickTail("M84 106 C104 104 104 84 96 76", c) + body(c) +
        both(`<path d="M30 42 L32 14 L54 28 Z" fill="${c}"/><path d="M35 34 L36 21 L47 28 Z" fill="${p}" stroke="none"/>`) +
        `<ellipse cx="60" cy="52" rx="34" ry="30" fill="${c}"/>` +
        `<path d="M60 23 v8 M51 24 l2 6 M69 24 l-2 6" fill="none" stroke="#d98a3d" stroke-width="3"/>` +
        eyes(51, 14) + blush(61, 23) +
        `<path d="M56.5 57 h7 l-3.5 3.5 Z" fill="#f2808f" stroke-width="2"/>` + wMouth(61) + whiskers(57)); })(),

      Bunny: (() => { const c = "#fffaf6", p = "#f9b8c4"; return svgWrap(
        body(c) +
        both(`<g transform="rotate(-8 46 22)"><ellipse cx="46" cy="18" rx="10" ry="23" fill="${c}"/>` +
             `<ellipse cx="46" cy="20" rx="4.5" ry="15" fill="${p}" stroke="none"/></g>`) +
        `<ellipse cx="60" cy="56" rx="33" ry="28" fill="${c}"/>` +
        eyes(54, 14) + blush(64, 23) +
        `<ellipse cx="60" cy="61" rx="3.5" ry="2.6" fill="#f2808f" stroke-width="2"/>` + wMouth(64)); })(),

      Bear: (() => { const c = "#c8915f", l = "#efd2ad"; return svgWrap(
        body(c, `<ellipse cx="60" cy="98" rx="14" ry="11" fill="${l}" stroke="none"/>`) +
        both(`<circle cx="33" cy="28" r="11" fill="${c}"/><circle cx="33" cy="28" r="5" fill="${l}" stroke="none"/>`) +
        `<ellipse cx="60" cy="52" rx="34" ry="30" fill="${c}"/>` +
        eyes(48, 14) + blush(60, 24) +
        `<ellipse cx="60" cy="63" rx="14" ry="10" fill="${l}"/>` +
        `<ellipse cx="60" cy="59" rx="5" ry="3.5" fill="#33241a"/>` +
        `<path d="M60 62.5 v3 M55.5 66 q4.5 3.5 9 0" fill="none" stroke-width="2.5"/>`); })(),

      Frog: (() => { const c = "#9bd877"; return svgWrap(
        body(c, `<ellipse cx="60" cy="100" rx="15" ry="10" fill="#d9f2b8" stroke="none"/>`) +
        both(`<circle cx="40" cy="34" r="14" fill="${c}"/>`) +
        `<ellipse cx="60" cy="58" rx="38" ry="26" fill="${c}"/>` +
        both(`<circle cx="40" cy="34" r="12" fill="${c}" stroke="none"/>` +
             `<circle cx="40" cy="34" r="8.5" fill="#fff" stroke-width="2.5"/>` +
             `<circle cx="41" cy="35" r="4.5" fill="#33241a" stroke="none"/>` +
             `<circle cx="42.5" cy="33.2" r="1.5" fill="#fff" stroke="none"/>`) +
        blush(62, 26) + `<path d="M44 62 q16 12 32 0" fill="none" stroke-width="3.5"/>`); })(),

      Panda: (() => { const c = "#ffffff", k = "#3a3a42"; return svgWrap(
        body(c, both(`<ellipse cx="41" cy="94" rx="7" ry="11" transform="rotate(15 41 94)" fill="${k}" stroke="none"/>`)) +
        both(`<circle cx="33" cy="28" r="11" fill="${k}"/>`) +
        `<ellipse cx="60" cy="52" rx="34" ry="30" fill="${c}"/>` +
        both(`<ellipse cx="45" cy="52" rx="8.5" ry="11" transform="rotate(30 45 52)" fill="${k}" stroke="none"/>` +
             `<circle cx="46" cy="51" r="3.6" fill="#fff" stroke="none"/>` +
             `<circle cx="46.5" cy="51.5" r="2" fill="${k}" stroke="none"/>`) +
        blush(64, 24) +
        `<ellipse cx="60" cy="62" rx="4.5" ry="3" fill="${k}"/>` + wMouth(65)); })(),

      Lion: (() => { const c = "#f8d590", m = "#e3902f"; let mane = "";
        for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6;
          mane += `<circle cx="${(60 + 33 * Math.cos(a)).toFixed(1)}" cy="${(52 + 30 * Math.sin(a)).toFixed(1)}" r="12" fill="${m}"/>`; }
        return svgWrap(
        thickTail("M84 106 C100 108 104 96 100 88", c) + `<circle cx="100" cy="86" r="6" fill="${m}" stroke-width="3"/>` +
        body(c) + mane + `<ellipse cx="60" cy="52" rx="34" ry="31" fill="${m}" stroke="none"/>` +
        both(`<circle cx="38" cy="32" r="8" fill="${c}"/>`) +
        `<ellipse cx="60" cy="54" rx="27" ry="25" fill="${c}"/>` +
        eyes(50, 11) + blush(60, 18) +
        `<path d="M55.5 58 h9 l-4.5 4.5 Z" fill="#7a4a30" stroke-width="2"/>` + wMouth(63)); })(),

      Mouse: (() => { const c = "#d3cdd6", p = "#f6b3bd"; return svgWrap(
        `<path d="M86 108 C108 112 112 90 100 86" fill="none" stroke="#e7959f" stroke-width="4"/>` + body(c) +
        both(`<circle cx="31" cy="30" r="18" fill="${c}"/><circle cx="31" cy="30" r="10.5" fill="${p}" stroke="none"/>`) +
        `<ellipse cx="60" cy="56" rx="31" ry="27" fill="${c}"/>` +
        eyes(54, 12) + blush(64, 21) +
        `<circle cx="60" cy="63" r="4" fill="#f2808f" stroke-width="2"/>` + whiskers(63) +
        `<path d="M56 69 q4 3 8 0" fill="none" stroke-width="2.5"/>`); })(),

      Sheep: (() => { const w = "#fbf8f2", f = "#f6dcc4"; let wool = "";
        [[40, 96], [50, 88], [70, 88], [80, 96], [46, 106], [74, 106], [60, 104]].forEach(([x, y]) => wool += `<circle cx="${x}" cy="${y}" r="13" fill="${w}"/>`);
        return svgWrap(
        both(`<ellipse cx="50" cy="114" rx="6" ry="4" fill="#6b5446" stroke="none"/>`) +
        wool + `<ellipse cx="60" cy="98" rx="24" ry="13" fill="${w}" stroke="none"/>` +
        both(`<ellipse cx="30" cy="54" rx="11" ry="6" transform="rotate(-15 30 54)" fill="${f}"/>`) +
        `<ellipse cx="60" cy="58" rx="26" ry="24" fill="${f}"/>` +
        `<circle cx="45" cy="38" r="11" fill="${w}"/><circle cx="75" cy="38" r="11" fill="${w}"/><circle cx="60" cy="32" r="12" fill="${w}"/>` +
        `<ellipse cx="60" cy="40" rx="18" ry="7" fill="${w}" stroke="none"/>` +
        eyes(58, 11) + blush(68, 18) + wMouth(66)); })()
    };

    const pictures = Object.keys(animalArt).map(name => ({ name, art: animalArt[name] }));

    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const board = document.getElementById("gameBoard");
    const cardCountSelect = document.getElementById("cardCount");
    const playAgainButton = document.getElementById("playAgain");
    const statusText = document.getElementById("status");
    const winMessage = document.getElementById("winMessage");
    const playerModeSelect = document.getElementById("playerMode");
    const scoreboard = document.getElementById("scoreboard");

    // How long a wrong pair stays face up, so little ones can remember where things are
    const MISMATCH_DELAY_MS = 2000;

    const TEAMS = {
      red: { name: "Red Team", color: "#d63339" },
      blue: { name: "Blue Team", color: "#2f6fd6" }
    };
    let gameId = 0; // bumps on every new game so old timers do nothing
    let teamMode = false;
    let currentTeam = "red";
    const scores = { red: 0, blue: 0 };

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let matchesFound = 0;
    let totalPairs = 0;

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function makeTrumpetSound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;

      const ctx = new AudioContext();
      const masterGain = ctx.createGain();
      masterGain.gain.value = 0.32;
      masterGain.connect(ctx.destination);

      function playTrumpetNote(frequency, startTime, duration) {
        const oscillator = ctx.createOscillator();
        const brightOscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        oscillator.type = "sawtooth";
        brightOscillator.type = "square";
        oscillator.frequency.setValueAtTime(frequency, startTime);
        brightOscillator.frequency.setValueAtTime(frequency * 2, startTime);

        filter.type = "bandpass";
        filter.frequency.setValueAtTime(950, startTime);
        filter.Q.value = 1.25;

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(0.32, startTime + 0.035);
        gain.gain.setValueAtTime(0.24, startTime + duration * 0.62);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        oscillator.connect(filter);
        brightOscillator.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);

        oscillator.start(startTime);
        brightOscillator.start(startTime);
        oscillator.stop(startTime + duration);
        brightOscillator.stop(startTime + duration);
      }

      const now = ctx.currentTime;
      const melody = [
        { frequency: 523.25, offset: 0, duration: 0.16 },
        { frequency: 659.25, offset: 0.16, duration: 0.16 },
        { frequency: 783.99, offset: 0.32, duration: 0.22 },
        { frequency: 1046.5, offset: 0.56, duration: 0.42 }
      ];

      melody.forEach(note => {
        playTrumpetNote(note.frequency, now + note.offset, note.duration);
      });

      setTimeout(() => ctx.close(), 1300);
    }

    // Gentle two-note chime for each match
    function makeChimeSound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const now = ctx.currentTime;
      [[784, 0], [1175, 0.12]].forEach(([frequency, offset]) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(frequency, now + offset);
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.18, now + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.55);
      });
      setTimeout(() => ctx.close(), 900);
    }

    // Small sparkle burst from the matched cards
    function sparkleAt(card) {
      const rect = card.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const symbols = ["✨", "⭐", "✨", "💛"];
      for (let i = 0; i < 10; i++) {
        const angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.4;
        const distance = rect.width * (0.55 + Math.random() * 0.35);
        const spark = document.createElement("div");
        spark.className = "sparkle";
        spark.textContent = symbols[i % symbols.length];
        spark.style.left = cx + "px";
        spark.style.top = cy + "px";
        spark.style.setProperty("--dx", Math.cos(angle) * distance + "px");
        spark.style.setProperty("--dy", Math.sin(angle) * distance + "px");
        document.body.appendChild(spark);
        setTimeout(() => spark.remove(), 900);
      }
    }

    function smallCelebrate(cardA, cardB) {
      makeChimeSound();
      sparkleAt(cardA);
      sparkleAt(cardB);
    }

    // Big celebration, saved for the end of the game
    function celebrate() {
      makeTrumpetSound();
      const colors = ["#ff6392", "#ffe45e", "#7bdff2", "#b2f7ef", "#cdb4db", "#95d5b2"];

      for (let i = 0; i < 80; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = 1.6 + Math.random() * 1.4 + "s";
        piece.style.animationDelay = Math.random() * 0.15 + "s";
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 3200);
      }
    }

    const narrowScreen = window.matchMedia("(max-width: 640px)");

    function setGrid(cardCount) {
      // 24 cards use 6 columns on wide screens, but stay at 4 on phones so cards don't overlap
      const columns = cardCount > 16 && !narrowScreen.matches ? 6 : 4;
      board.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 138px))`;
      board.style.width = "100%";
    }

    function buildDeck(cardCount) {
      totalPairs = cardCount / 2;
      const chosenPictures = shuffle(pictures).slice(0, totalPairs);
      const picturePairs = shuffle([...chosenPictures, ...chosenPictures]);
      const chosenLetters = letters.slice(0, cardCount);

      return picturePairs.map((picture, index) => ({
        ...picture,
        letter: chosenLetters[index],
        id: `${picture.name}-${index}`
      }));
    }

    function createCard(cardData, index) {
      const card = document.createElement("button");
      card.className = "card";
      card.type = "button";
      card.dataset.name = cardData.name;
      card.dataset.label = `Card ${index + 1}, letter ${cardData.letter}`;
      card.setAttribute("aria-label", card.dataset.label);

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face front">
            <div class="letter">${cardData.letter}</div>
          </div>
          <div class="card-face back">
            <div class="picture">${cardData.art}</div>
            <div class="picture-name">${cardData.name}</div>
          </div>
        </div>
      `;

      card.addEventListener("click", () => flipCard(card));
      return card;
    }

    function flipCard(card) {
      if (lockBoard || card === firstCard || card.classList.contains("matched")) return;

      card.classList.add("flipped");
      card.setAttribute("aria-label", `${card.dataset.name} card`);

      if (!firstCard) {
        firstCard = card;
        statusText.textContent = teamMode ? `${TEAMS[currentTeam].name}: pick one more card!` : "Pick one more card!";
        return;
      }

      secondCard = card;
      lockBoard = true;
      checkForMatch();
    }

    function checkForMatch() {
      const isMatch = firstCard.dataset.name === secondCard.dataset.name;

      if (isMatch) {
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");
        firstCard.disabled = true;
        secondCard.disabled = true;
        matchesFound++;
        const animal = firstCard.dataset.name;

        if (teamMode) {
          firstCard.classList.add(`found-${currentTeam}`);
          secondCard.classList.add(`found-${currentTeam}`);
          scores[currentTeam]++;
          updateScoreboard(true);
          statusText.textContent = `Great match! ${animal}! ${TEAMS[currentTeam].name} goes again!`;
        } else {
          statusText.textContent = `Great match! ${animal}!`;
        }

        smallCelebrate(firstCard, secondCard);
        resetTurn();

        if (matchesFound === totalPairs) {
          finishGame();
        }
      } else {
        statusText.textContent = teamMode ? "Not a match. Look carefully!" : "Try again!";
        const thisGame = gameId;
        setTimeout(() => {
          if (thisGame !== gameId) return;
          firstCard.classList.remove("flipped");
          secondCard.classList.remove("flipped");
          firstCard.setAttribute("aria-label", firstCard.dataset.label);
          secondCard.setAttribute("aria-label", secondCard.dataset.label);
          resetTurn();
          if (teamMode) {
            currentTeam = currentTeam === "red" ? "blue" : "red";
            updateScoreboard(false);
            statusText.textContent = `${TEAMS[currentTeam].name}'s turn!`;
          } else {
            statusText.textContent = "Find a match!";
          }
        }, MISMATCH_DELAY_MS);
      }
    }

    function finishGame() {
      // let the last match's sparkle play, then the big celebration
      const thisGame = gameId;
      setTimeout(() => {
        if (thisGame !== gameId) return;
        if (teamMode) {
          let message;
          if (scores.red === scores.blue) {
            message = `It's a tie, ${scores.red} to ${scores.blue}! Both teams did great! 🎉`;
            statusText.textContent = "It's a tie!";
          } else {
            const winner = scores.red > scores.blue ? "red" : "blue";
            const loser = winner === "red" ? "blue" : "red";
            message = `${TEAMS[winner].name} wins, ${scores[winner]} to ${scores[loser]}! Great job, everyone! 🎉`;
            statusText.textContent = `${TEAMS[winner].name} wins!`;
          }
          winMessage.textContent = message;
          document.getElementById("teamRed").classList.remove("active");
          document.getElementById("teamBlue").classList.remove("active");
          document.body.style.removeProperty("--turn-color");
        } else {
          statusText.textContent = "All matched!";
          winMessage.textContent = "You matched them all! Great job! 🎉";
        }
        winMessage.classList.add("show");
        celebrate();
      }, 450);
    }

    function updateScoreboard(bump) {
      document.getElementById("scoreRed").textContent = scores.red;
      document.getElementById("scoreBlue").textContent = scores.blue;
      const red = document.getElementById("teamRed");
      const blue = document.getElementById("teamBlue");
      red.classList.toggle("active", currentTeam === "red");
      blue.classList.toggle("active", currentTeam === "blue");
      document.body.style.setProperty("--turn-color", TEAMS[currentTeam].color);
      if (bump) {
        const box = currentTeam === "red" ? red : blue;
        box.classList.remove("bump");
        void box.offsetWidth; // restart the animation
        box.classList.add("bump");
      }
    }

    function resetTurn() {
      [firstCard, secondCard] = [null, null];
      lockBoard = false;
    }

    function startGame() {
      const cardCount = Number(cardCountSelect.value);
      board.innerHTML = "";
      gameId++;
      winMessage.classList.remove("show");
      matchesFound = 0;
      teamMode = playerModeSelect.value === "teams";
      scoreboard.hidden = !teamMode;
      document.body.classList.toggle("teams-on", teamMode);
      if (teamMode) {
        scores.red = 0;
        scores.blue = 0;
        currentTeam = "red";
        updateScoreboard(false);
        statusText.textContent = "Red Team goes first!";
      } else {
        document.body.style.removeProperty("--turn-color");
        statusText.textContent = "Find a match!";
      }
      resetTurn();
      setGrid(cardCount);

      const deck = buildDeck(cardCount);
      deck.forEach((cardData, index) => {
        board.appendChild(createCard(cardData, index));
      });
    }

    narrowScreen.addEventListener("change", () => setGrid(Number(cardCountSelect.value)));
    playAgainButton.addEventListener("click", startGame);
    cardCountSelect.addEventListener("change", startGame);
    playerModeSelect.addEventListener("change", startGame);
    startGame();
  </script>
</body>
</html>
